pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def local = new File(settingsDir, "local.properties")
        if (local.exists()) {
            local.withInputStream { properties.load(it) }
        }
        def path = properties.getProperty("flutter.sdk")
        if (path == null) {
            // Allow CI / bootstrap without local.properties yet
            path = System.getenv("FLUTTER_ROOT") ?: System.getenv("FLUTTER_HOME")
        }
        assert path != null : "flutter.sdk not set in local.properties / FLUTTER_ROOT"
        return path
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.3.2" apply false
    id "org.jetbrains.kotlin.android" version "1.9.24" apply false
}

include ":app"
